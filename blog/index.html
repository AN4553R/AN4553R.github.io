<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writing — Abdelrahman Aly</title>
  <meta name="description" content="Writing by Abdelrahman Aly on software engineering and building products.">
  <link rel="canonical" href="https://abdoaly.com/blog/">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .posts-page { max-width: 700px; margin: 0 auto 0 10vw; padding: 72px 40px 96px 0; }
    .back-link { display: inline-block; margin-bottom: 58px; color: var(--muted); font-size: .85rem; text-decoration: none; border-bottom: 1px solid var(--hair); }
    .back-link:hover, .post-link:hover { color: var(--fg); border-color: var(--muted); }
    .section-label { margin-bottom: 28px; }
    .year { margin: 0 0 12px; color: var(--muted-2); font: .8rem var(--font-mono); }
    .post { display: grid; grid-template-columns: 112px 1fr; gap: 18px; padding: 12px 0; border-top: 1px solid var(--hair); }
    .date { color: var(--muted-2); font: .74rem/1.7 var(--font-mono); }
    .post-link { color: var(--fg); text-decoration: none; border-bottom: 1px solid transparent; }
    .post-desc { margin-top: 5px; color: var(--muted-2); font: .74rem/1.6 var(--font-mono); }
    @media (max-width: 600px) {
      .posts-page { margin: 0; padding: 56px 24px 80px; }
      .post { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <main class="posts-page">
    <a class="back-link" href="../index.html">← Abdelrahman Aly</a>
    <section aria-labelledby="posts-title">
      <h1 class="section-label" id="posts-title">BLOG POSTS</h1>
      <p class="year">2026</p>
      <article class="post">
        <time class="date" datetime="2026-10-24">24 Oct 2026</time>
        <div>
          <a class="post-link" href="../building-pixloop/">The photo arrived. The camera said “cancelled.”</a>
          <p class="post-desc">I wanted a simpler way to move Sony photos to my phone. Then a JPEG arrived while the camera still called the transfer cancelled.</p>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
